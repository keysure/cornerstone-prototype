name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack static site
        run: |
          set -euo pipefail
          ls -la site.b64.*
          cat site.b64.0* > site.b64
          python3 - <<'PY'
          import base64, tarfile, io, pathlib
          data = base64.b64decode(pathlib.Path("site.b64").read_text())
          public = pathlib.Path("public")
          public.mkdir(exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as tar:
              tar.extractall(public)
          (public / ".nojekyll").write_text("")
          print("extracted", sum(1 for _ in public.rglob("*")))
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
